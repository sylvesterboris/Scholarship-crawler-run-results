# Scholarship Intelligence Crawler — configuration
# Seeds are *entry points* (hub pages), not a list of scholarships. Every scholarship
# record is found by following links / sitemaps / search results from here.

database: data/scholarships.db

crawl:
  max_pages_per_run: 550        # total fetch budget per run (re-verification + discovery)
  max_pages_per_domain: 30
  max_depth: 3                  # link hops from a seed
  request_timeout: 25
  delay_per_domain_sec: 1.2     # politeness
  user_agent: "Mozilla/5.0 (compatible; AtlasScholarshipCrawler/1.0; research prototype; respects robots.txt)"
  respect_robots_txt: true
  max_pdf_pages: 25
  max_pdf_bytes: 12000000
  use_playwright_for_js_pages: auto   # auto = only if playwright is installed and the HTML is a JS shell

discovery:
  use_sitemaps: true
  use_search: true                    # DuckDuckGo HTML endpoint (free, no key). Skipped automatically if blocked.
  max_search_results_per_query: 10
  search_queries:
    - "scholarship scheme for students site:gov.in 2026-27"
    - "post matric scholarship state government site:gov.in"
    - "merit cum means scholarship site:ac.in 2026"
    - "foundation scholarship India undergraduate 2026-27 apply"
    - "CSR scholarship programme India girl students 2026"
    - "fellowship for Indian citizens study abroad 2026"
    - "scholarship for students with disabilities India site:gov.in"
    - "AICTE scholarship scheme 2026-27"

# Scoring / status thresholds
verification:
  verified_threshold: 95.0
  expiring_soon_days: 30
  unreachable_runs_before_stale: 2
  current_academic_year_start_month: 6   # Indian AY starts ~June/July

llm:
  enabled: auto            # auto = use local Ollama if it is running, else rule-based only
  ollama_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct"

